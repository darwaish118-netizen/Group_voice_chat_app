name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Add Internet permission
        working-directory: mobile
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Skip crashing lint tasks in third-party Android plugins
        working-directory: mobile
        shell: bash
        run: |
          if [ -f android/build.gradle ]; then
            GRADLE_FILE="android/build.gradle"
          elif [ -f android/build.gradle.kts ]; then
            GRADLE_FILE="android/build.gradle.kts"
          else
            echo "Android root Gradle build file not found" >&2
            exit 1
          fi

          cat >> "$GRADLE_FILE" <<'GRADLE'

          // Some third-party Android plugin lint detectors crash with NoSuchMethodError
          // in the current CI Android Lint toolchain. Keep the app module's lint intact.
          subprojects {
              tasks.configureEach {
                  if (project.path != ":app" && name.startsWith("lint")) {
                      enabled = false
                  }
              }
          }
          GRADLE

          echo "Disabled lint tasks only in third-party Android plugin modules: $GRADLE_FILE"







      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: group-voice-chat-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
