name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Add Internet permission
        working-directory: mobile
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Disable crashing image_picker Android release lint task
        working-directory: mobile
        shell: bash
        run: |
          GRADLE_FILE=""
          if [ -f android/build.gradle ]; then
            GRADLE_FILE="android/build.gradle"
          elif [ -f android/build.gradle.kts ]; then
            GRADLE_FILE="android/build.gradle.kts"
          else
            echo "Android root Gradle build file not found" >&2
            exit 1
          fi

          cat >> "$GRADLE_FILE" <<'GRADLE'

          // Work around the upstream lint detector crash in image_picker_android.
          subprojects {
              tasks.configureEach {
                  if (project.path == ":image_picker_android" && name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          GRADLE

          echo "Applied targeted lint workaround in $GRADLE_FILE"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: group-voice-chat-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
