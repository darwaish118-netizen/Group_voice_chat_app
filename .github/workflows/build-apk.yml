name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: mobile
        run: flutter create . --platforms=android

      - name: Add Internet permission
        working-directory: mobile
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Cache Android NDK 28.2.13676358
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358-v1

      - name: Ensure Android NDK 28.2.13676358
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$ANDROID_SDK" ]; then
            echo "ANDROID_SDK_ROOT / ANDROID_HOME is not set" >&2
            exit 1
          fi

          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found" >&2
            exit 1
          fi

          # Reuse a complete NDK installation; do not uninstall it on every run.
          NDK_DIR="$ANDROID_SDK/ndk/$NDK_VERSION"
          if [ -s "$NDK_DIR/source.properties" ]; then
            echo "NDK $NDK_VERSION is already present; reusing it."
            exit 0
          fi

          # Accept SDK licenses, then retry installation to tolerate transient
          # repository/network failures. Remove only an incomplete NDK folder.
          set +e
          yes | "$SDKMANAGER" --licenses
          license_status=${PIPESTATUS[1]}
          set -e
          if [ "$license_status" -ne 0 ]; then
            echo "sdkmanager --licenses failed with exit code $license_status" >&2
            exit "$license_status"
          fi

          rm -rf "$NDK_DIR"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)..."
            set +e
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION"
            install_status=${PIPESTATUS[1]}
            set -e

            if [ "$install_status" -eq 0 ] && [ -s "$NDK_DIR/source.properties" ]; then
              echo "NDK $NDK_VERSION installed successfully."
              exit 0
            fi

            echo "NDK installation attempt $attempt failed (sdkmanager exit: $install_status)." >&2
            rm -rf "$NDK_DIR"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Could not install Android NDK $NDK_VERSION after 3 attempts." >&2
          exit 1

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Skip crashing lint tasks in third-party Android plugins
        working-directory: mobile
        shell: bash
        run: |
          if [ -f android/build.gradle ]; then
            GRADLE_FILE="android/build.gradle"
          elif [ -f android/build.gradle.kts ]; then
            GRADLE_FILE="android/build.gradle.kts"
          else
            echo "Android root Gradle build file not found" >&2
            exit 1
          fi

          cat >> "$GRADLE_FILE" <<'GRADLE'

          // Some third-party Android plugin lint detectors crash with NoSuchMethodError
          // in the current CI Android Lint toolchain. Keep the app module's lint intact.
          subprojects {
              tasks.configureEach {
                  if (project.path != ":app" && name.startsWith("lint")) {
                      enabled = false
                  }
              }
          }
          GRADLE

          echo "Disabled lint tasks only in third-party Android plugin modules: $GRADLE_FILE"







      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: group-voice-chat-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
