
services:
  - type: web
    name: mindo-admin-dashboard
    runtime: static
    buildCommand: echo "Publishing MINDO VOICE CHAT Admin Dashboard"
    staticPublishPath: ./admin
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
